 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glowing Bulb</title>

    <style>

        body {
            text-align: center;
            background-color: black;
            color: white;
        }

        .bulb {
            width: 150px;
            height: 150px;
            background-color: gray;
            border-radius: 50%;
            margin: 100px auto 30px;
        }

        .glow {
            background-color: yellow;
            box-shadow: 
                0 0 20px yellow,
                0 0 40px yellow,
                0 0 80px yellow;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <h1>Light Bulb</h1>

    <div class="bulb" id="bulb"></div>

    <button id="btn">ON / OFF</button>

    <script src="BEexer.js"></script>

</body>
</html>
